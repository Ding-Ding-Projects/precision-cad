name: Publish project website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: precision-cad-website
  cancel-in-progress: false
jobs:
  website:
    runs-on: windows-2025
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap and build static website
        shell: pwsh
        env:
          PUBLIC_BASE_PATH: /precision-cad
        run: ./scripts/bootstrap-website.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Retain safe build provenance
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: website-build-evidence
          path: |
            website/public/provenance.json
          if-no-files-found: warn
          retention-days: 7
